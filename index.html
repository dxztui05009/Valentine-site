<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://rerofya.github.io/resources/flower.css">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<title>Happy Valentines</title>

<style>
body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:#000;
}

/* title */
h1{
  position: fixed;
  top: 20px;
  width: 100%;
  text-align: center;
  color: #ff4d6d;
  font-family: 'Great Vibes', cursive;
  font-size: 34px;
  font-weight: normal;
  z-index: 5;
}

/* ❤️ PHOTO */
.photo-wrap{
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translate(-50%, -45%);
  width: 220px;
  height: 260px;
  z-index: 5;
}

/* glow */
.photo-wrap::before{
  content: "";
  position: absolute;
  inset: -15px;
  background: rgba(255, 77, 109, 0.45);
  filter: blur(25px);
  border-radius: 50%;
  z-index: -1;
}

.photo{
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 20px;
  border: 5px solid #ff4d6d;
}

/* 💌 envelope button */
.envelope-btn{
  position: fixed;
  right: 20px;
  top: 28%;
  background:#ff4d6d;
  color:white;
  border:none;
  padding:12px 18px;
  border-radius: 12px;
  font-size:16px;
  cursor:pointer;
  z-index: 6;
  box-shadow:0 0 15px #ff4d6d;
}

/* letter popup */
.letter{
  position: fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width: 260px;
  background:white;
  color:#ff4d6d;
  padding:20px;
  border-radius:15px;
  text-align:center;
  font-family: 'Great Vibes', cursive;
  font-size:22px;
  display:none;
  z-index: 10;
}

.close-btn{
  margin-top:15px;
  background:#ff4d6d;
  border:none;
  color:white;
  padding:8px 15px;
  border-radius:10px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="flower-container"></div>

<h1>Happy Valentines Day MyL Darling Shane 💌</h1>

<div class="photo-wrap">
  <img src="photo.png" class="photo">
</div>

<button class="envelope-btn" onclick="openLetter()">💌 Open</button>

<div class="letter" id="letter">
  Happy Valentine’s Day ❤️<br>
  You make my world brighter everyday ✨
  <br>
  <button class="close-btn" onclick="closeLetter()">Close</button>
</div>

<script src="https://rerofya.github.io/resources/flower.js"></script>

<script>
function openLetter(){
  document.getElementById("letter").style.display="block";
}
function closeLetter(){
  document.getElementById("letter").style.display="none";
}
</script>

<!-- 🎵 MUSIC HERE -->
<audio autoplay loop>
  <source src="music.mp3.mp3" type="audio/mpeg">
</audio>

</body>
</html>
